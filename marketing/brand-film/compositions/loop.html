  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#lp-eyebrow .t", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, 0.03);

    /* tre righe, ognuna entra come il dato che rappresenta */
    const rows = ["#lp-r1", "#lp-r2", "#lp-r3"];
    rows.forEach((r, i) => {
      tl.fromTo(r + " .lp-head", { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.34, ease: "expo.out" }, 0.15 + i * 0.45);
      tl.fromTo(r + " .lp-sub", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.3 + i * 0.45);
    });

    /* barra piena: cresce da sinistra */
    tl.fromTo("#lp-f1", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.35);

    /* barra scomposta: i tre segmenti in sequenza, non insieme */
    tl.fromTo("#lp-s1", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.82);
    tl.fromTo("#lp-s2", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 1.1);
    tl.fromTo("#lp-s3", { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "power3.out" }, 1.3);
    tl.fromTo("#lp-legend span", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.07 }, 1.45);

    /* la linea del peso si disegna: e' il feedback che valida le stime sopra */
    tl.fromTo("#lp-line", { strokeDasharray: 980, strokeDashoffset: 980 },
      { strokeDashoffset: 0, duration: 1.15, ease: "power2.inOut" }, 1.5);
    tl.fromTo("#lp-dot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.55);

    /* convergenza */
    tl.fromTo("#lp-arrow", { scaleY: 0 }, { scaleY: 1, duration: 0.38, ease: "power3.out" }, 4.5);
    tl.fromTo("#lp-converge .t", { opacity: 0, yPercent: 24 },
      { opacity: 1, yPercent: 0, duration: 0.4, ease: "expo.out" }, 4.78);
    tl.fromTo("#lp-converge .s", { opacity: 0 }, { opacity: 1, duration: 0.24 }, 5.05);

    /* uscita: whip verticale — tutto scende e sfoca, spinto dalla convergenza */
    tl.to("#lp-band", { y: -70, opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 7.25);

    window.__timelines["loop"] = tl;
  </script>
