<!doctype html>
<html
  lang="it"
  data-composition-variables='[
    {"id":"hookLine","type":"string","label":"Riga hook","default":"Calcolato in un secondo."},
    {"id":"doubtLine","type":"string","label":"Riga dubbio","default":"Ogni equazione predittiva ha un errore individuale."},
    {"id":"claimLine","type":"string","label":"Claim","default":"Il target non è una stima. È una conseguenza."},
    {"id":"endClaim","type":"string","label":"Claim finale","default":"Il metabolismo non si calcola. Si osserva."},
    {"id":"volt","type":"color","label":"Accento","default":"#D4FF4F"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #08090b;
        --ink: #f2f3f5;
        --mute: #71767f;
        --volt: #d4ff4f;
        --line: rgba(255, 255, 255, 0.1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33.5"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <div id="ground" data-layout-ignore
           style="position:absolute;inset:0;background:var(--ground);z-index:0"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:1"></div>

      <div id="verdict" data-composition-id="verdict" data-composition-src="compositions/verdict.html"
           data-start="5.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="loop" data-composition-id="loop" data-composition-src="compositions/loop.html"
           data-start="11" data-duration="7.6" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:3"></div>

      <div id="macro" data-composition-id="macro" data-composition-src="compositions/macro.html"
           data-start="18.6" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:4"></div>

      <div id="correction" data-composition-id="correction" data-composition-src="compositions/correction.html"
           data-start="23.1" data-duration="5.8" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:5"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="28.9" data-duration="4.6" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index:6"></div>

      <audio id="sfx-land"  class="clip" src="assets/sfx/impact-bass-1.mp3"    data-start="1.2"  data-duration="2.1"  data-volume="0.85" data-fade-out="0.4" data-track-index="9"></audio>
      <audio id="sfx-doubt" class="clip" src="assets/sfx/glitch-2.mp3"         data-start="5.7"  data-duration="1.2"  data-volume="0.5"  data-fade-out="0.3" data-track-index="10"></audio>
      <audio id="sfx-ping"  class="clip" src="assets/sfx/ping.mp3"             data-start="9"    data-duration="1.32" data-volume="0.45" data-track-index="11"></audio>
      <audio id="sfx-rows"  class="clip" src="assets/sfx/whoosh-short.mp3"     data-start="11.2" data-duration="0.57" data-volume="0.4"  data-track-index="12"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3"            data-start="15.8" data-duration="2.8"  data-volume="0.45" data-fade-in="0.5" data-fade-out="0.25" data-track-index="13"></audio>
      <audio id="sfx-whip"  class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="18.4" data-duration="1.4"  data-volume="0.55" data-fade-out="0.4" data-track-index="14"></audio>
      <audio id="sfx-plate" class="clip" src="assets/sfx/ping.mp3"             data-start="18.75" data-duration="1.1"  data-volume="0.35" data-track-index="17"></audio>
      <audio id="sfx-swap"  class="clip" src="assets/sfx/whoosh-short.mp3"     data-start="22.9"  data-duration="0.57" data-volume="0.4"  data-track-index="18"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3"            data-start="25.6" data-duration="2.1"  data-volume="0.5"  data-fade-out="0.5" data-track-index="15"></audio>
      <audio id="sfx-logo"  class="clip" src="assets/sfx/impact-bass-2.mp3"    data-start="29.1" data-duration="2.59" data-volume="0.9"  data-fade-out="0.6" data-track-index="16"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
